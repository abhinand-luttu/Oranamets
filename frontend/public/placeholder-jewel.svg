<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="luxury-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="50%" stop-color="#F5F0E6" />
      <stop offset="100%" stop-color="#EFE8D8" />
    </linearGradient>
    <linearGradient id="gold-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6C987" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#9E7D3B" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="400" fill="url(#luxury-bg)" />
  <circle cx="200" cy="180" r="110" fill="none" stroke="url(#gold-stroke)" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />
  <circle cx="200" cy="180" r="85" fill="#FFFFFF" fill-opacity="0.6" stroke="url(#gold-stroke)" stroke-width="1.2" opacity="0.7" />

  <!-- Modern Faceted Gem / Statement Necklace Center Silhouette -->
  <g transform="translate(200, 180) scale(1.3)">
    <!-- Gem Top Crown -->
    <polygon points="-30,-18 30,-18 20,-32 -20,-32" fill="none" stroke="url(#gold-stroke)" stroke-width="1.5" />
    <!-- Gem Pavilion -->
    <polygon points="-30,-18 30,-18 0,32" fill="none" stroke="url(#gold-stroke)" stroke-width="1.5" />
    <!-- Internal Facets -->
    <line x1="-12" y1="-18" x2="0" y2="32" stroke="url(#gold-stroke)" stroke-width="1" opacity="0.6" />
    <line x1="12" y1="-18" x2="0" y2="32" stroke="url(#gold-stroke)" stroke-width="1" opacity="0.6" />
    <line x1="-20" y1="-32" x2="-12" y2="-18" stroke="url(#gold-stroke)" stroke-width="1" opacity="0.6" />
    <line x1="20" y1="-32" x2="12" y2="-18" stroke="url(#gold-stroke)" stroke-width="1" opacity="0.6" />
  </g>

  <text x="200" y="295" font-family="'Cinzel', 'Cormorant Garamond', Georgia, serif" font-size="14" font-weight="600" fill="#181512" text-anchor="middle" letter-spacing="4">Z I V A R A</text>
  <text x="200" y="316" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="500" fill="#9E7D3B" text-anchor="middle" letter-spacing="3" opacity="0.9">HAUTE JOAILLERIE</text>
</svg>
