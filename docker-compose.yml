version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: rajwadi_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rajwadi_db
      POSTGRES_USER: rajwadi_user
      POSTGRES_PASSWORD: rajwadi_secure_password_2026
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rajwadi_backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: rajwadi-production-secret-key-cloud-2026
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://rajwadi_user:rajwadi_secure_password_2026@db:5432/rajwadi_db
    volumes:
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rajwadi_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  media_volume:
